name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Unit + integration tests (H2)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Build and test
        run: mvn -B verify
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: jacoco-report
          path: target/site/jacoco
      - uses: actions/upload-artifact@v4
        with:
          name: app-jar
          path: target/buchhaus-*.jar

  mysql:
    name: Integration tests on MySQL 8 (row locks, constraints)
    runs-on: ubuntu-latest
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_DATABASE: buchhaus
          MYSQL_USER: buchhaus
          MYSQL_PASSWORD: buchhaus
          MYSQL_ROOT_PASSWORD: root
        ports: ["3306:3306"]
        options: >-
          --health-cmd="mysqladmin ping -h localhost -ubuchhaus -pbuchhaus"
          --health-interval=5s --health-timeout=3s --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Run integration tests against MySQL
        env:
          SPRING_PROFILES_ACTIVE: mysql
          DB_USER: buchhaus
          DB_PASSWORD: buchhaus
          DB_URL: jdbc:mysql://localhost:3306/buchhaus?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        run: mvn -B test -Dtest='ApiIntegrationTest'

  e2e:
    name: Cypress end-to-end
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
      - uses: actions/download-artifact@v4
        with:
          name: app-jar
          path: dist
      - name: Start the app (H2 + demo data)
        run: |
          nohup java -jar dist/buchhaus-*.jar > app.log 2>&1 &
          for i in $(seq 1 60); do curl -sf http://localhost:8080/actuator/health && break; sleep 2; done
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Install Cypress
        working-directory: e2e
        run: npm install
      - name: Run Cypress specs (catalogue, shopping, admin)
        working-directory: e2e
        env:
          CYPRESS_BASE_URL: http://localhost:8080
        run: npx cypress run --browser chrome
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: cypress-screenshots
          path: |
            e2e/cypress/screenshots
            app.log

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t buchhaus .
