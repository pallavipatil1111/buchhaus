server:
  port: ${PORT:8080}
  error:
    include-message: always

spring:
  application:
    name: buchhaus
  datasource:
    url: jdbc:h2:mem:buchhaus;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    open-in-view: false
    hibernate:
      # Flyway owns the schema (src/main/resources/db/migration); Hibernate never alters it.
      ddl-auto: none
    properties:
      hibernate.jdbc.time_zone: UTC
      hibernate.type.preferred_instant_jdbc_type: TIMESTAMP
  flyway:
    enabled: true
  jackson:
    default-property-inclusion: always
    serialization:
      write-dates-as-timestamps: false

app:
  zone: ${APP_ZONE:Asia/Kolkata}
  demo-data: ${DEMO_DATA:true}
  admin:
    # Created on first start if missing. Change both for any real deployment.
    email: ${ADMIN_EMAIL:admin@buchhaus.local}
    password: ${ADMIN_PASSWORD:Admin@12345}
  jwt:
    # Override in every real deployment: JWT_SECRET must be at least 32 characters.
    secret: ${JWT_SECRET:dev-only-secret-change-me-dev-only-secret-change-me}
    expiry-minutes: ${JWT_EXPIRY_MINUTES:1440}

management:
  endpoints:
    web:
      exposure:
        include: health,info
  endpoint:
    health:
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
